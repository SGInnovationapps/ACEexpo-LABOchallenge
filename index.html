<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>なぞときスタンプラリー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --red:#E4262B; --yellow:#FFD500; --orange:#F29100; --ink:#241F1C;
  --paper:#FFFBEF; --card:#FFFFFF; --line:#241F1C; --muted:#6B625C;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#FFF7E6;--card:#FFFFFF;}}
:root[data-theme="dark"]{--paper:#FFF7E6;--card:#FFFFFF;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;font-weight:500;line-height:1.7;
  background-image:radial-gradient(var(--yellow) 1.5px, transparent 1.6px);background-size:18px 18px}
.wrap{max-width:430px;margin:0 auto;padding:14px 14px 40px}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.bar img{width:46px;height:46px;border-radius:50%;flex:none}
.bar h1{font-size:19px;font-weight:900;margin:0;letter-spacing:.02em}
.bar p{margin:0;font-size:12px;color:var(--muted)}
.card{background:var(--card);border:3px solid var(--line);border-radius:18px;padding:14px;box-shadow:4px 4px 0 var(--line);margin-bottom:14px}
.board-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.board-head b{font-size:15px;font-weight:900}
.count{font-size:13px;font-weight:700;background:var(--yellow);border:2px solid var(--line);border-radius:999px;padding:1px 10px}
.grid{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.slot{text-align:center;flex:0 0 calc(33.333% - 7px)}
.disc{position:relative;aspect-ratio:1;border-radius:50%;border:3px dashed #C9C1B8;display:flex;align-items:center;justify-content:center;
  font-size:20px;font-weight:900;color:#BDB4AA;background:#FFFDF6;overflow:hidden}
.disc img{width:100%;height:100%;object-fit:contain;transform:rotate(-9deg)}
.disc.on{border:0;background:none}
.disc.fin{border:3px solid var(--orange);color:var(--orange);background:#FFF3DC;font-size:15px}
.slot span{display:block;font-size:11px;color:var(--muted);margin-top:3px;line-height:1.35;word-break:break-all}
.slot.done span{color:var(--red);font-weight:700}
.stamped{animation:stamp .45s cubic-bezier(.2,1.5,.4,1)}
@keyframes stamp{0%{transform:scale(2.6) rotate(-30deg);opacity:0}60%{opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}60%{transform:translateX(9px)}}
@media (prefers-reduced-motion: reduce){.stamped,.shake{animation:none}}
.qhead{background:var(--red);color:#fff;border:3px solid var(--line);border-radius:14px;padding:8px 12px;text-align:center;margin-bottom:12px}
.qhead b{display:block;font-size:22px;font-weight:900;line-height:1.3}
.qhead span{font-size:13px}
.lead{text-align:center;font-size:15px;margin:0 0 12px}
input[type=text]{width:100%;height:56px;font-size:22px;text-align:center;font-family:inherit;font-weight:700;color:var(--ink);
  border:3px solid var(--line);border-radius:12px;background:#fff;padding:0 10px}
input[type=text]:focus{outline:3px solid var(--orange);outline-offset:2px}
button{font-family:inherit;font-weight:700;cursor:pointer}
.btn{width:100%;height:56px;font-size:18px;font-weight:900;color:#fff;background:var(--red);border:3px solid var(--line);border-radius:12px;box-shadow:3px 3px 0 var(--line)}
.btn:active{transform:translate(3px,3px);box-shadow:none}
.btn.sub{background:#fff;color:var(--ink);font-size:14px;height:44px;font-weight:700;box-shadow:2px 2px 0 var(--line)}
.btn.go{background:var(--orange)}
.err{color:var(--red);font-size:13px;font-weight:700;min-height:20px;margin:6px 0 2px;text-align:center}
.judge{min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center}
.mark{font-size:76px;line-height:1;font-weight:900}
.hint{font-size:13px;background:var(--yellow);border:2px solid var(--line);border-radius:10px;padding:4px 12px;margin-top:6px}
.tiles{display:flex;justify-content:center;flex-wrap:wrap;gap:7px;margin:10px 0}
.tile{width:46px;height:46px;border:3px solid var(--line);border-radius:10px;background:var(--yellow);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900}
.tile.q{background:#F2ECE3;color:#BDB4AA}
.rows{margin:6px 0 0}
.row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:2px dotted #DCD4C9;font-size:14px}
.row:last-child{border-bottom:0}
.row .no{width:54px;font-weight:900}
.row .pl{flex:1;color:var(--muted)}
.tag{font-size:11px;font-weight:700;border:2px solid var(--line);border-radius:999px;padding:0 8px}
.tag.ok{background:var(--red);color:#fff}
.tag.yet{background:#fff;color:var(--muted);border-color:#C9C1B8}
.clear{text-align:center}
.clear .big{font-size:30px;font-weight:900;color:var(--red);margin:6px 0 2px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0}
.stat{border:3px solid var(--line);border-radius:12px;padding:6px}
.stat i{display:block;font-size:11px;font-style:normal;color:var(--muted)}
.stat b{font-size:22px;font-weight:900;letter-spacing:.06em}
.labo{width:100%;max-width:230px;margin:6px auto 0;display:block}
.foot{text-align:center;font-size:11px;color:var(--muted);margin-top:16px}
.qr-item{border:3px solid var(--line);border-radius:14px;padding:12px;text-align:center;margin-bottom:12px;background:#fff;page-break-inside:avoid}
.qr-item canvas,.qr-item img{margin:6px auto}
.qr-item b{font-size:20px;font-weight:900;display:block}
.qr-item code{font-size:11px;color:var(--muted);word-break:break-all}

.pick{display:grid;gap:12px}
.pick button{height:92px;border:3px solid var(--line);border-radius:16px;box-shadow:4px 4px 0 var(--line);background:#fff;font-size:22px;font-weight:900;color:var(--ink);line-height:1.3}
.pick button span{display:block;font-size:13px;font-weight:700;color:var(--muted)}
.pick button.low{background:var(--yellow)}
.pick button.high{background:var(--orange);color:#fff}
.pick button.high span{color:#FFE9C2}
.pick button:active{transform:translate(4px,4px);box-shadow:none}
.badge{font-size:11px;font-weight:900;border:2px solid var(--line);border-radius:999px;padding:0 8px;background:var(--yellow)}
.badge.high{background:var(--orange);color:#fff}
.bar .right{margin-left:auto;display:flex;align-items:center;gap:8px}
.bar .labomark{width:62px;height:auto;border-radius:8px;border:2px solid var(--line);background:#fff;flex:none}
.subbar{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin:-4px 0 10px}
.chg{font-size:11px;font-weight:700;background:#fff;border:2px solid #C9C1B8;border-radius:999px;padding:1px 8px;color:var(--muted);margin-top:4px}
.memo{font-size:12px;color:var(--muted);text-align:left;margin:8px 0 0;line-height:1.6}

.ov{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  background:rgba(36,31,28,.55);backdrop-filter:blur(2px);animation:ovin .18s ease-out;padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px)}
.ov.out{animation:ovout .28s ease-in forwards}
@keyframes ovin{from{opacity:0}to{opacity:1}}
@keyframes ovout{from{opacity:1}to{opacity:0}}
.ov .holder{position:relative;width:200px;height:200px;display:flex;align-items:center;justify-content:center}
.ov .slam{width:190px;height:190px;animation:slam .5s cubic-bezier(.2,1.3,.3,1) forwards}
@keyframes slam{0%{transform:scale(3.4) rotate(-34deg);opacity:0}45%{opacity:1}70%{transform:scale(.92) rotate(-6deg)}100%{transform:scale(1) rotate(-8deg);opacity:1}}
.ov .ring{position:absolute;inset:0;border:7px solid #fff;border-radius:50%;opacity:0;animation:ring .7s .3s ease-out forwards}
.ov .ring.b{animation-delay:.42s;border-color:var(--yellow)}
@keyframes ring{0%{transform:scale(.7);opacity:.9}100%{transform:scale(2.1);opacity:0}}
.ov .cap{opacity:0;animation:capin .32s .45s cubic-bezier(.2,1.5,.4,1) forwards;text-align:center}
@keyframes capin{from{opacity:0;transform:translateY(12px) scale(.9)}to{opacity:1;transform:none}}
.ov .cap p{margin:0;color:#fff;font-size:26px;font-weight:900;text-shadow:0 2px 0 var(--line)}
.ov .cap small{color:#FFF3C4;font-size:13px;font-weight:700}
.ov .tile{background:var(--yellow);box-shadow:3px 3px 0 var(--line)}
.ov .tap{color:#FFF3C4;font-size:12px;font-weight:700;opacity:0;animation:capin .3s 1.1s forwards}
.quake{animation:quake .32s .3s}
@keyframes quake{0%,100%{transform:none}25%{transform:translate(-4px,3px)}50%{transform:translate(4px,-3px)}75%{transform:translate(-3px,-2px)}}
@media (prefers-reduced-motion: reduce){.ov .slam,.ov .ring,.ov .cap,.ov .tap,.quake{animation:none;opacity:1}}
@media print{body{background:#fff}.noprint{display:none}}
</style>
</head>

function norm(s){
  return (s||"").normalize("NFKC").replace(/[\s\u3000]/g,"")
    .replace(/[\u30a1-\u30f6]/g, c => String.fromCharCode(c.charCodeAt(0)-96));
}
function match(list, v){ return (list||[]).some(a => norm(a) === norm(v)); }
function allDone(){ return state.done.every(Boolean); }
function param(k){ return new URLSearchParams(location.search).get(k); }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function header(){
  const sub = course ? `<div class="subbar"><span class="badge ${course==="high"?"high":""}">${esc(cfg().badge)}</span>
    <button class="chg" id="chg">がくねんをかえる</button></div>` : "";
  return `<div class="bar"><img src="${GYM_LOGO}" alt="">
    <div><h1>${esc(CONFIG.title)}</h1><p>${esc(CONFIG.subtitle)}</p></div>
    <div class="right"><img class="labomark" src="${LABO_LOGO}" alt="ACE LABO"></div></div>${sub}`;
}
function board(){
  const n = state.done.filter(Boolean).length;
  const cells = SPOTS.map((sp,i)=>{
    const on = state.done[i];
    const cls = "disc" + (on ? " on" : "") + (justStamped===i ? " stamped" : "");
    return `<div class="slot${on?" done":""}"><div class="${cls}">${on ? `<img src="${GYM_LOGO}" alt="クリア">` : sp.no}</div>
      <span>${on ? "クリア" : esc(sp.place)}</span></div>`;
  }).join("");
  const fin = `<div class="slot"><div class="disc fin${justStamped===99?" stamped":""}">${state.fin ? "完" : (allDone()? "最終謎" : "？")}</div>
    <span>${state.fin ? "ぜんぶクリア" : (allDone() ? "最終謎に挑戦" : "4こ集めると")}</span></div>`;
  return `<div class="card"><div class="board-head"><b>スタンプ台紙</b>
    <span class="count">${n} / ${SPOTS.length} こ</span></div>
    <div class="grid">${cells}${fin}</div></div>`;
}
function judgeBox(){ return `<div class="judge" id="judge"><span style="font-size:13px;color:var(--muted)">ひらがなで入力してもいいよ</span></div>`; }
function answerForm(name){
  return `${judgeBox()}
    <input type="text" id="ans" placeholder="${name}" autocomplete="off" enterkeyhint="done">
    <p class="err" id="err"></p>
    <button class="btn" id="go">こたえあわせ</button>`;
}
function animate(node, html, cls){
  node.innerHTML = html; node.classList.remove("stamped","shake");
  void node.offsetWidth; node.classList.add(cls);
}

function render(){
  if(!course){ app.innerHTML = header() + ""; return pickScreen(); }
  app.innerHTML = header() + board() + `<div id="screen"></div>` +
    `<p class="foot">主催 ACE LABO ／ こまったときは受付まで</p>`;
  const s = document.getElementById("screen");
  justStamped = -1;
  const sp = SPOTS.find(x => x.id === param("q"));
  if(state.fin) clearScreen(s);
  else if(allDone()) finalScreen(s);
  else if(sp) questionScreen(s, sp);
  else hubScreen(s);
}

function pickScreen(){
  const sp = SPOTS.find(x => x.id === param("q"));
  const guide = sp ? `<div class="qhead"><b>第${sp.no}問</b><span>${esc(sp.place)}</span></div>` : "";
  app.innerHTML += `<div class="card">${guide}
    <p class="lead"><b>がくねんをえらんでね</b><br><span style="font-size:13px;color:var(--muted)">えらぶと、その学年のなぞがひらきます</span></p>
    <div class="pick">
      <button class="low" data-c="low">1・2・3年生<span>ていがくねんコース</span></button>
      <button class="high" data-c="high">4・5・6年生<span>こうがくねんコース</span></button>
    </div></div>
    <p class="foot">主催 ACE LABO ／ こまったときは受付まで</p>`;
  app.querySelectorAll(".pick button").forEach(b => b.onclick = () => { setCourse(b.dataset.c); render(); });
}

function hubScreen(s){
  const rows = SPOTS.map((sp,i)=>`<div class="row"><span class="no">第${sp.no}問</span>
    <span class="pl">${esc(sp.place)}</span>
    <span class="tag ${state.done[i]?"ok":"yet"}">${state.done[i]?"クリア":"みちょうせん"}</span></div>`).join("");
  s.innerHTML = `<div class="card">
    <p class="lead"><b>どこからスタートしてもOK</b><br>会場のポスターのQRを読み取ってね<br>
    <span style="font-size:13px;color:var(--muted)">ポスターの「${esc(cfg().badge)}」のなぞをといてね</span></p>
    <div class="rows">${rows}</div></div>`;
}

function questionScreen(s, sp){
  const i = SPOTS.indexOf(sp), p = puz(i);
  const head = `<div class="qhead"><b>第${sp.no}問</b><span>${esc(sp.place)}　${esc(cfg().badge)}</span></div>`;
  if(state.done[i]){
    s.innerHTML = `<div class="card">${head}
      <div class="judge"><div class="mark" style="color:var(--red)">〇</div>
      <p style="margin:0;font-weight:900">この問題はクリアずみ</p>
      ${p.letter?`<p style="margin:6px 0 0;font-size:13px">もらった文字</p><div class="tiles"><div class="tile">${esc(p.letter)}</div></div>`:""}</div>
      ${remain()}</div>`;
    return;
  }
  if(!p.answers || !p.answers.length){
    s.innerHTML = `<div class="card">${head}<p class="lead">この問題はじゅんび中です</p></div>`;
    return;
  }
  s.innerHTML = `<div class="card">${head}
    <p class="lead">ポスターのなぞを見て、こたえを入力してね</p>
    ${CONFIG.showMemo && p.memo ? `<p class="memo">${esc(p.memo)}</p>` : ""}
    ${answerForm("こたえを入力")}
    ${CONFIG.showGiveup ? `<button class="btn sub" id="gu" style="margin-top:10px">ギブアップしてこたえを見る</button>` : ""}
    </div>`;
  bind(sp.id, p.answers, p.hint, () => {
    state.done[i] = true; save();
    stampEffect(p, () => {
      justStamped = i;
      render();
      const j = document.createElement("div");
      j.className = "card";
      j.innerHTML = `<div class="judge"><div class="mark" style="color:var(--red)">〇</div>
        <p style="margin:0;font-size:20px;font-weight:900">せいかい！　スタンプゲット</p>
        ${p.letter?`<p style="margin:6px 0 0;font-size:13px">合言葉の文字をもらったよ</p><div class="tiles"><div class="tile stamped">${esc(p.letter)}</div></div>`:""}</div>
        ${remain()}`;
      const scr = document.getElementById("screen");
      scr.innerHTML = ""; scr.appendChild(j);
      window.scrollTo({top:0, behavior:"smooth"});
    });
  });
  const gu = document.getElementById("gu");
  if(gu) gu.onclick = () => animate(document.getElementById("judge"),
    `<p style="margin:0;font-size:13px;color:var(--muted)">こたえ</p>
     <div style="font-size:40px;font-weight:900">${esc(p.answers[0])}</div>
     <p style="margin:0;font-size:12px;color:var(--muted)">ギブアップなのでスタンプはつきません</p>`, "stamped");
}


/* 正解したときのスタンプ演出 */
function stampEffect(p, done){
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const ov = document.createElement("div");
  ov.className = "ov";
  ov.innerHTML = `<div class="holder">
      <span class="ring"></span><span class="ring b"></span>
      <img class="slam" src="${GYM_LOGO}" alt="">
    </div>
    <div class="cap"><p>せいかい！</p>
      <small>スタンプをゲットした</small>
      ${p.letter?`<div class="tiles" style="margin:10px 0 0"><div class="tile">${esc(p.letter)}</div></div>`:""}
    </div>
    <span class="tap">画面をタップしてつづける</span>`;
  document.body.appendChild(ov);
  if(!reduce){
    document.body.classList.add("quake");
    setTimeout(()=>document.body.classList.remove("quake"), 700);
    if(navigator.vibrate) try{ navigator.vibrate(30); }catch(e){}
  }
  let closed = false;
  const close = () => {
    if(closed) return; closed = true;
    ov.classList.add("out");
    setTimeout(()=>{ ov.remove(); done(); }, reduce ? 0 : 260);
  };
  ov.addEventListener("click", close);
  setTimeout(close, reduce ? 400 : 2300);
}

function remain(){
  if(allDone()) return `<button class="btn go" id="tofinal" style="margin-top:12px">最終謎にちょうせん</button>`;
  const left = SPOTS.filter((sp,i)=>!state.done[i]).map(sp=>sp.place).join("、");
  return `<p style="text-align:center;font-size:13px;color:var(--muted);margin:10px 0 0">のこりの場所：${esc(left)}</p>
    <button class="btn sub" id="tohub" style="margin-top:10px">スタンプ台紙にもどる</button>`;
}

function finalScreen(s){
  const F = cfg().final;
  const tiles = cfg().puzzles.filter(p=>p.letter).map(p=>`<div class="tile">${esc(p.letter)}</div>`).join("")
    || SPOTS.map(()=>`<div class="tile q">？</div>`).join("");
  if(!F.answers || !F.answers.length){
    s.innerHTML = `<div class="card"><div class="qhead"><b>最終謎</b><span>じゅんび中</span></div>
      <p class="lead">受付にこの画面を見せてください</p></div>`;
    return;
  }
  s.innerHTML = `<div class="card"><div class="qhead"><b>最終謎</b><span>スタンプぜんぶ集まった</span></div>
    <p class="lead">${esc(F.lead)}</p>
    <div class="tiles">${tiles}</div>
    ${answerForm("合言葉を入力")}</div>`;
  bind("final", F.answers, F.hint, () => {
    const d = new Date();
    state.fin = true;
    state.time = ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2);
    state.code = (course==="high"?"H":"L") + Math.random().toString(36).slice(2,5).toUpperCase();
    save(); justStamped = 99; render();
  });
}

function clearScreen(s){
  s.innerHTML = `<div class="card clear">
    <img class="stamped" src="${GYM_LOGO}" alt="" style="width:110px;height:110px;display:block;margin:0 auto">
    <p class="big">ぜんぶクリア！</p>
    <p style="margin:0;font-size:14px">${esc(CONFIG.clearMessage)}</p>
    <div class="stats">
      <div class="stat"><i>クリア時刻</i><b>${esc(state.time||"--:--")}</b></div>
      <div class="stat"><i>クリア番号</i><b>${esc(state.code||"----")}</b></div>
    </div>
    <p style="margin:0;font-size:12px;color:var(--muted)">${esc(cfg().label)}コース</p>
    <img class="labo" src="${LABO_LOGO}" alt="ACE LABO">
  </div>`;
}

function bind(k, answers, hint, onOK){
  const input = document.getElementById("ans"), err = document.getElementById("err"),
        go = document.getElementById("go"), judge = document.getElementById("judge");
  if(!input) return;
  input.oninput = () => err.textContent = "";
  input.onkeydown = e => { if(e.key === "Enter") go.click(); };
  go.onclick = () => {
    const v = input.value;
    if(!norm(v)){ err.textContent = "こたえを入力してね"; input.focus(); return; }
    if(match(answers, v)){ onOK(); return; }
    const mk = course + k;
    miss[mk] = (miss[mk] || 0) + 1;
    const h = (miss[mk] >= CONFIG.hintAfter && hint) ? `<div class="hint">ヒント：${esc(hint)}</div>` : "";
    animate(judge, `<div class="mark" style="color:var(--orange)">×</div>
      <p style="margin:0;font-size:17px;font-weight:900">ざんねん、もう一回！</p>
      <p style="margin:0;font-size:12px;color:var(--muted)">まちがい ${miss[mk]} 回</p>${h}`, "shake");
  };
}

document.addEventListener("click", e => {
  if(e.target.id === "tohub" || e.target.id === "tofinal"){
    history.replaceState(null,"",location.pathname); render(); window.scrollTo({top:0});
  }
  if(e.target.id === "chg"){
    course = null; try{ localStorage.removeItem(CKEY); }catch(err){}
    history.replaceState(null,"",location.pathname); render(); window.scrollTo({top:0});
  }
});

/* 運営用：?qr=1 でQRコード一覧（掲示物に貼る・印刷可）、問題と答えのメモつき */
function qrSheet(){
  const base = location.origin + location.pathname;
  const memo = i => ["low","high"].map(c => {
    const p = CONFIG.courses[c].puzzles[i];
    return `<div class="memo"><b>${esc(CONFIG.courses[c].badge)}</b>　${esc(p.memo||"")}<br>こたえ：${esc((p.answers||[]).join(" / "))}　→　文字「${esc(p.letter)}」</div>`;
  }).join("");
  app.innerHTML = `<div class="bar"><img src="${GYM_LOGO}" alt=""><div><h1>QRコード一覧</h1><p>運営用</p></div>
    <div class="right"><img class="labomark" src="${LABO_LOGO}" alt="ACE LABO"></div></div>` +
    `<div class="card noprint"><p class="lead" style="margin:0">掲示物に貼るQRです。1か所につき1つで、低学年・高学年の両方に使えます。このページはそのまま印刷できます。</p></div>` +
    SPOTS.map((sp,i) => `<div class="qr-item"><b>第${sp.no}問</b><span>${esc(sp.place)}</span>
      <div class="qrbox" data-url="${base}?q=${sp.id}"></div>
      <code>${base}?q=${sp.id}</code>${memo(i)}</div>`).join("") +
    `<div class="qr-item"><b>スタート用</b><span>受付・入口（問題なし）</span>
      <div class="qrbox" data-url="${base}"></div><code>${base}</code></div>`;
  const s = document.createElement("script");
  s.src = "https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js";
  s.onload = () => document.querySelectorAll(".qrbox").forEach(b => {
    new QRCode(b, { text: b.dataset.url, width: 200, height: 200, correctLevel: QRCode.CorrectLevel.M });
  });
  s.onerror = () => document.querySelectorAll(".qrbox").forEach(b => b.textContent = "QRを表示できませんでした（通信を確認してください）");
  document.body.appendChild(s);
}

try{ const c = localStorage.getItem(CKEY); if(c && CONFIG.courses[c]) setCourse(c); }catch(e){}
if(param("qr")) qrSheet();
else if(param("reset") !== null){
  try{ localStorage.removeItem("ace-nazo-rally-v2-low"); localStorage.removeItem("ace-nazo-rally-v2-high"); localStorage.removeItem(CKEY); }catch(e){}
  location.replace(location.pathname);
}
else render();

</script>
</body>
